version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      lint-and-types:
        patterns: ["ruff", "mypy", "pydocstyle", "darglint", "import-linter"]
      test-stack:
        patterns: ["pytest*", "hypothesis", "testcontainers*"]
