[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resilience-kit"
dynamic = ["version"]
description = "Framework-agnostic Python resilience + core-infrastructure kernel — retries, circuit breakers, throttles, cache, SSRF guard, DNS-pinned HTTP client, audit decorators, field crypto. Pluggable backends. Adapters for Django + FastAPI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Prajwal Mahajan" }]
keywords = [
    "resilience",
    "circuit-breaker",
    "retry",
    "rate-limit",
    "throttle",
    "ssrf",
    "django",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Framework :: Django",
    "Framework :: FastAPI",
]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pybreaker>=1.2",
]

[project.urls]
Homepage = "https://github.com/prajwalmahajan101/resilience-kit"
Documentation = "https://github.com/prajwalmahajan101/resilience-kit/tree/main/docs"
Repository = "https://github.com/prajwalmahajan101/resilience-kit"
Issues = "https://github.com/prajwalmahajan101/resilience-kit/issues"
Changelog = "https://github.com/prajwalmahajan101/resilience-kit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
redis = ["redis>=5.0"]
http = ["httpx>=0.27,<0.29"]
requests = ["requests>=2.31"]
crypto = ["cryptography>=42.0"]
audit-postgres = ["asyncpg>=0.29"]
django = ["django>=4.2,<7", "djangorestframework>=3.14"]
fastapi = ["fastapi>=0.110", "starlette>=0.36", "sqlalchemy>=2.0", "httpx>=0.27,<0.29"]
all = [
    "redis>=5.0",
    "httpx>=0.27,<0.29",
    "requests>=2.31",
    "cryptography>=42.0",
    "asyncpg>=0.29",
    "django>=4.2,<7",
    "djangorestframework>=3.14",
    "fastapi>=0.110",
    "starlette>=0.36",
    "sqlalchemy>=2.0",
]

# Entry-point groups for third-party backend discovery (LLD §3).
# Builtins are also published here so the provider chain has one shape
# everywhere: every name (kit-shipped or third-party) resolves the same way.
[project.entry-points."resilience_kit.cache_backends"]
memory = "resilience_kit.cache.memory_impl:InMemoryAsyncCache"

[project.entry-points."resilience_kit.breaker_backends"]
memory = "resilience_kit.circuit_breaker.memory_impl:InMemoryAsyncBreaker"

[project.entry-points."resilience_kit.throttle_backends"]
memory = "resilience_kit.throttle.memory_impl:InMemoryAsyncThrottle"

[project.entry-points."resilience_kit.audit_backends"]
noop = "resilience_kit.audit.backends.noop:NoopAuditBackend"
stdlib_logging = "resilience_kit.audit.backends.stdlib_logging:StdlibLoggingAuditBackend"

[project.entry-points."resilience_kit.audit_sanitizers"]
default = "resilience_kit.audit.sanitizers:DefaultRedactor"

[project.entry-points."resilience_kit.metrics_sinks"]
noop = "resilience_kit.metrics:NoopMetricsSink"
stdlib_logging = "resilience_kit.metrics:StdlibLoggingMetricsSink"

[project.entry-points."resilience_kit.settings_sources"]

[tool.hatch.version]
path = "src/resilience_kit/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src/resilience_kit", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/resilience_kit"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pydocstyle>=6.3",
    "darglint>=1.8",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    "pytest-django>=4.12.0",
]
test-integration = [
    "psycopg[binary]>=3.3.4",
    "testcontainers[redis,postgresql]>=4.7",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: requires Docker / testcontainers (deselect with '-m \"not integration\"')",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["resilience_kit"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.pydocstyle]
convention = "google"
add-ignore = ["D104", "D107"]  # missing docstring in __init__ — acceptable
match-dir = "^(?!tests|adapters).*"

[tool.darglint]
docstring_style = "google"
strictness = "short"
